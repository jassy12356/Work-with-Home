<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}
.container{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
}
h1{
  text-align:center;
  color:#007bff;
}
.card{
  background:#f8f8f8;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:5px;
  background:#28a745;
  color:white;
  font-size:16px;
}
.withdraw{
  background:#ff9800;
}
</style>
</head>
<body>

<div class="container">

<h1>User Dashboard</h1>

<div class="card">
<h3>👤 Welcome User</h3>
</div>

<div class="card">
<h3>💰 Coin Balance: <span id="balance">0</span> PKR</h3>
</div>

<div class="card">
<h3>📹 Daily Videos Available: 1000</h3>
</div>

<button onclick="watchVideo()">▶ Watch Video</button>

<div class="card">
<h3>💵 Today's Earnings: <span id="earnings">0</span> PKR</h3>
</div>

<button class="withdraw" onclick="window.location.href='payment.html'">🏧 Withdrawal (Minimum 10000 PKR)</button>

</div>
  <script>
let savedBalance = localStorage.getItem("balance") || 0;
document.getElementById("balance").innerHTML = savedBalance;
document.getElementById("earnings").innerHTML = localStorage.getItem("earnings") || 0;
    function watchVideo() {
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");
let balance = parseInt(localStorage.getItem("balance")) || 0;
balance += 10;
localStorage.setItem("balance", balance);
    setTimeout(function () {
      document.getElementById("balance").innerHTML =
"💰 Coin Balance: " + balance + " PKR";
 let earnings = parseInt(localStorage.getItem("earnings")) || 0;
earnings += 10;
document.getElementById("earnings").innerHTML = earnings;

localStorage.setItem("earnings", earnings);
alert("Video completed! You earned 10 PKR");
    }, 10000);
}
</script>

</body>
</html>
