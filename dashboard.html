<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}
.container{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
}
h1{
  text-align:center;
  color:#007bff;
}
.card{
  background:#f8f8f8;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:5px;
  background:#28a745;
  color:white;
  font-size:16px;
}
.withdraw{
  background:#ff9800;
}
</style>
</head>
<body>

<div class="container">

<h1>User Dashboard</h1>

<div class="card">
<h3>👤 Welcome User</h3>
</div>

<div class="card">
<h3>💰 Coin Balance: 0 PKR</h3>
</div>

<div class="card">
<h3>📹 Daily Videos Available: 1000</h3>
</div>

<button onclick="watchVideo()">▶ Watch Video</button>

<div class="card">
<h3>💵 Today's Earnings: 0 PKR</h3>
</div>

<button class="withdraw">🏧 Withdrawal (Minimum 10000 PKR)</button>

</div>
  <script>
function watchVideo() {
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");

    setTimeout(function () {
        alert("Video completed! You earned PKR 10.");
    }, 10000);
}
</script>

</body>
</html>
