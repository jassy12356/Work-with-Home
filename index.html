 <!DOCTYPE html>
<html>
<head>
<title>Work From Home</title>
<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:20px;
}
.container{
background:white;
max-width:400px;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}
img{
width:80px;
border-radius:50%;
}
input{
width:90%;
padding:10px;
margin:8px 0;
}
button{
background:green;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
<img src="IMG_20260729_220000.jpg">

<h1>Work From Home</h1>
<p>Register below to apply.</p>

<form onsubmit="return checkApproval()">
<input type="text" placeholder="Full Name" required><br>
<input type="email" placeholder="Email" required><br>
<input type="tel" placeholder="Phone Number" required><br>
<button type="submit">Register Now</button>
</form>

</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4zXHG1QuBiozdZDiQlSGhn_g1_2_Jo58",
  authDomain: "work-with-home-3cbc8.firebaseapp.com",
  projectId: "work-with-home-3cbc8",
  storageBucket: "work-with-home-3cbc8.firebasestorage.app",
  messagingSenderId: "579230440177",
  appId: "1:579230440177:web:36f7973a2d234d66966750",
  measurementId: "G-GQZDWRWDGN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.checkApproval = async function () {
  const snap = await getDoc(doc(db, "Admin", "Admin"));

  if (snap.exists() && snap.data().Approved === true) {
    window.location.href = "plans.html";
  } else {
    alert("Payment not approved yet.");
  }

  return false;
}
</script>

</body>
</html>
