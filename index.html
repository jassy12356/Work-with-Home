 <!DOCTYPE html>
<html>
<head>
<title>Work From Home</title>
<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:30px;
}
.container{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 0 10px #ccc;
}
.logo{
width:80px;
height:80px;
border-radius:50%;
}
input{
width:90%;
padding:10px;
margin:8px 0;
}
button{
background:green;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<img class="logo" src="IMG_20260729_225350.jpg" alt="Logo">

<h1>Work From Home</h1>
<p>Register below to apply.</p>

<form action="https://formspree.io/f/xkodevok" method="POST">
<input type="text" name="name" placeholder="Full Name" required><br>
<input type="email" name="email" placeholder="Email" required><br>
<input type="tel" name="phone" placeholder="Phone Number" required><br>
<button type="submit">Register Now</button>
</form>

</div>

</body>
</html>
